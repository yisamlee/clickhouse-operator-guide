apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: clickhouse-cert
  namespace: default
spec:
  secretName: clickhouse-cert-secret
  dnsNames:
    - "*.clickhouse-headless.default.svc"
    - "*.clickhouse-headless.default.svc.cluster.local"
  issuerRef:
    name: local-ca-issuer
    kind: Issuer
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: clickhouse
  namespace: default
spec:
  shards: 2
  replicas: 2
  keeperClusterRef:
    name: keeper
  dataVolumeClaimSpec:
    storageClassName: gp3
    resources:
      requests:
        storage: 500Gi
  podTemplate:
    nodeSelector:
      role: clickhouse
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: clickhouse
  containerTemplate:
    resources:
      requests:
        cpu: "2"
        memory: "16Gi"
      limits:
        cpu: "4"
        memory: "32Gi"
  podDisruptionBudget:
    maxUnavailable: 1
